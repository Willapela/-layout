<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Editor Pro — Upload, Edite e Visualize</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">&lt;/&gt;</span>
        <div>
          <h1>HTML Editor Pro</h1>
          <p class="tagline">Upload • Edite • Visualize</p>
        </div>
      </div>
      <div class="header-actions">
        <label class="btn btn-primary" for="file-input">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Upload HTML
        </label>
        <input type="file" id="file-input" accept=".html,.htm,.txt" hidden>
        <button class="btn btn-secondary" id="btn-new" title="Novo arquivo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="18" x2="12" y2="12"/>
            <line x1="9" y1="15" x2="15" y2="15"/>
          </svg>
          Novo
        </button>
        <button class="btn btn-secondary" id="btn-download" title="Baixar HTML">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Baixar
        </button>
        <button class="btn btn-ghost" id="btn-fullscreen-preview" title="Preview em tela cheia">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 3 21 3 21 9"/>
            <polyline points="9 21 3 21 3 15"/>
            <line x1="21" y1="3" x2="14" y2="10"/>
            <line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="file-name" id="file-name">sem-titulo.html</span>
        <span class="status" id="status">Pronto</span>
      </div>
      <div class="toolbar-right">
        <label class="toggle">
          <input type="checkbox" id="live-preview" checked>
          <span>Preview ao vivo</span>
        </label>
        <button class="btn btn-sm" id="btn-run" title="Atualizar preview (Ctrl+Enter)">
          ▶ Atualizar
        </button>
        <button class="btn btn-sm" id="btn-format" title="Formatar código">
          Formatar
        </button>
      </div>
    </div>

    <!-- Main workspace -->
    <main class="workspace">
      <div class="panel editor-panel" id="editor-panel">
        <div class="panel-header">
          <span>Editor</span>
          <div class="panel-actions">
            <button class="icon-btn" id="btn-clear" title="Limpar">✕</button>
          </div>
        </div>
        <div id="editor-container"></div>
      </div>

      <div class="resizer" id="resizer"></div>

      <div class="panel preview-panel" id="preview-panel">
        <div class="panel-header">
          <span>Preview</span>
          <div class="panel-actions">
            <button class="icon-btn" id="btn-refresh" title="Recarregar">↻</button>
            <button class="icon-btn" id="btn-open-new" title="Abrir em nova aba">↗</button>
          </div>
        </div>
        <iframe id="preview" sandbox="allow-scripts allow-same-origin allow-modals allow-forms" title="Preview do HTML"></iframe>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>HTML Editor Pro • Funciona 100% no navegador • Seus arquivos não saem do seu dispositivo</span>
      <span id="char-count">0 caracteres</span>
    </footer>
  </div>

  <!-- Fullscreen preview overlay -->
  <div class="fullscreen-overlay" id="fullscreen-overlay" hidden>
    <div class="fullscreen-header">
      <span>Preview em tela cheia</span>
      <button class="btn btn-sm" id="btn-close-fullscreen">Fechar (Esc)</button>
    </div>
    <iframe id="preview-fullscreen" sandbox="allow-scripts allow-same-origin allow-modals allow-forms" title="Preview tela cheia"></iframe>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/html-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/xml-hint.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
